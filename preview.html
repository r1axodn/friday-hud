<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>HUD device preview</title>
<style>
  html,body{margin:0;background:#0b0f12;color:#8ad;font:12px/1.3 system-ui,sans-serif}
  .row{display:flex;gap:18px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  .dev{ }
  .dev p{margin:0 0 6px;font-size:11px;letter-spacing:.1em;color:#5d8}
  .frame{border:2px solid #234;border-radius:10px;overflow:hidden;background:#000;display:block}
  .s62{transform:scale(.62);transform-origin:0 0}
  .s70{transform:scale(.70);transform-origin:0 0}
  .s85{transform:scale(.85);transform-origin:0 0}
  .wrap{width:calc(var(--w) * var(--s));height:calc(var(--h) * var(--s))}
</style></head>
<body>
<div class="row">
  <div class="dev"><p>IPHONE 390×844</p>
    <div class="frame" style="width:390px;height:844px"><iframe src="./index.html?lock=0&demo=1&pv=5" width="390" height="844" frameborder="0"></iframe></div>
  </div>
  <div class="dev"><p>IPAD PORTRAIT 820×1180 (62%)</p>
    <div class="wrap" style="--w:820px;--h:1180px;--s:.62">
      <div class="frame s62" style="width:820px;height:1180px"><iframe src="./index.html?lock=0&demo=1&pv=6" width="820" height="1180" frameborder="0"></iframe></div>
    </div>
  </div>
  <div class="dev"><p>IPAD LANDSCAPE 1180×820 (70%)</p>
    <div class="wrap" style="--w:1180px;--h:820px;--s:.7">
      <div class="frame s70" style="width:1180px;height:820px"><iframe src="./index.html?lock=0&demo=1&pv=7" width="1180" height="820" frameborder="0"></iframe></div>
    </div>
  </div>
  <div class="dev"><p>IPHONE LANDSCAPE 844×390 (85%)</p>
    <div class="wrap" style="--w:844px;--h:390px;--s:.85">
      <div class="frame s85" style="width:844px;height:390px"><iframe src="./index.html?lock=0&demo=1&pv=8" width="844" height="390" frameborder="0"></iframe></div>
    </div>
  </div>
</div>
</body></html>
