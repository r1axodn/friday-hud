<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03070b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FRIDAY HUD">
<meta name="description" content="FRIDAY HUD — 개인 홀로그램 대시보드">
<title>FRIDAY HUD</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=24">
<script>
  window.__errs = [];
  addEventListener("error", function (e) { window.__errs.push(String((e && e.message) || e)); });
  addEventListener("unhandledrejection", function (e) { window.__errs.push("rejection:" + String(e && e.reason)); });
</script>
</head>
<body>

<div id="hud" class="hud" hidden></div>

<!-- 잠금 화면 (인증 전에는 잠금 화면 외 어떠한 대시보드 콘텐츠도 내려주거나 렌더링하지 않음) -->
<div class="lock" id="lock">
  <div class="lock-bg" aria-hidden="true"></div>
  <div class="lock-core" id="lockCore">
    <div class="lock-time" id="lockTime">--:--</div>
    <div class="lock-date" id="lockDate">—</div>
    <div class="lock-hint" id="lockHint">길게 눌러 잠금 해제</div>
  </div>
  <div class="lock-pad" id="lockPad" hidden>
    <div class="lock-pad-title">ENTER PASSCODE</div>
    <div class="lock-dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
    <div class="lock-keys">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" data-k="back" class="fn">⌫</button>
      <button type="button" data-k="0">0</button>
      <button type="button" data-k="cancel" class="fn">취소</button>
    </div>
  </div>
</div>

<div id="overlays"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"
        onerror="window.__sbLoadFail=true"></script>
<script src="app.js?v=24"></script>
</body>
</html>
